name: dd-platform

x-pretix-environment: &pretix-environment
  PRETIX_PRETIX_INSTANCE_NAME: DD studio local development
  PRETIX_PRETIX_URL: http://127.0.0.1:8345
  PRETIX_PRETIX_DATADIR: /data
  PRETIX_PRETIX_CURRENCY: DKK
  PRETIX_PRETIX_PLUGINS_DEFAULT: pretix.plugins.statistics,pretix.plugins.checkinlists,pretix.plugins.stripe
  PRETIX_PRETIX_PASSWORD_RESET: "off"
  PRETIX_LOCALE_DEFAULT: da
  PRETIX_LOCALE_TIMEZONE: Europe/Copenhagen
  PRETIX_DATABASE_BACKEND: postgresql
  PRETIX_DATABASE_NAME: pretix
  PRETIX_DATABASE_USER: pretix_runtime
  PRETIX_DATABASE_PASSWORD: ${PRETIX_RUNTIME_PASSWORD:-not-provisioned}
  PRETIX_DATABASE_HOST: postgres
  PRETIX_REDIS_LOCATION: redis://redis:6379/0
  PRETIX_REDIS_SESSIONS: "true"
  PRETIX_CELERY_BACKEND: redis://redis:6379/1
  PRETIX_CELERY_BROKER: redis://redis:6379/2
  AUTOMIGRATE: skip
  PRETIX_MAIL_HOST: mail-capture
  PRETIX_MAIL_PORT: "1025"
  PRETIX_MAIL_FROM: noreply+booking@didde-mie.com
  PRETIX_MAIL_TLS: "off"
  PRETIX_MAIL_SSL: "off"

services:
  mail-capture:
    image: axllent/mailpit:v1.31.1
    user: "1000:1000"
    environment:
      MP_MAX_MESSAGES: "1000"
      MP_SMTP_MAX_MESSAGE_SIZE: "10"
    ports:
      - "127.0.0.1:8025:8025"
    restart: unless-stopped

  pretix-migrate:
    image: pretix/standalone:2026.7.0
    profiles: [migration]
    command: migrate
    environment:
      <<: *pretix-environment
      PRETIX_DATABASE_USER: pretix_migrator
      PRETIX_DATABASE_PASSWORD: ${PRETIX_MIGRATION_PASSWORD:-not-provisioned}
    volumes:
      - pretix-data:/data

  postgres:
    image: postgres:17.6-alpine
    ports:
      - "127.0.0.1:5433:5432"
    environment:
      POSTGRES_DB: pretix
      POSTGRES_USER: dd_local_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - pretix-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dd_local_admin -d pretix"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7.4.5-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - pretix-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  pretix:
    image: pretix/standalone:2026.7.0
    command: all
    environment: *pretix-environment
    ports:
      - "127.0.0.1:8345:80"
    volumes:
      - pretix-data:/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  pretix-cron:
    image: pretix/standalone:2026.7.0
    entrypoint: ["/bin/sh", "-c"]
    command: ["while true; do pretix cron; sleep 1800; done"]
    environment: *pretix-environment
    volumes:
      - pretix-data:/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pretix-postgres:
  pretix-redis:
  pretix-data:
