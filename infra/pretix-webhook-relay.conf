# Credential injection is bound only to the producer interface, never destination.
# No access/error records can contain credentials, bodies or order identifiers.
access_log off;
error_log /dev/null emerg;
limit_req_zone $binary_remote_addr zone=pretix_source:1m rate=10r/s;
server {
 listen 172.26.0.3:8081;
 server_name _;
 allow 172.26.0.2;
 deny all;
 client_max_body_size 2k;
 client_body_timeout 5s;
 location = /api/manage/pretix-webhook {
  limit_except POST { deny all; }
  limit_req zone=pretix_source burst=20 nodelay;
  limit_req_status 429;
  proxy_connect_timeout 2s;
  proxy_read_timeout 10s;
  proxy_send_timeout 5s;
  include /run/secrets/pretix-webhook-header;
  proxy_pass http://172.27.0.2:3000;
  proxy_set_header Host booking.didde-mie.com;
  proxy_set_header X-Forwarded-Proto https;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For "";
 }
 location / { return 404; }
}
