# Loopback HTTP ingress; terminate TLS at the host ingress before deployment.
# Never log query strings, fragments, request bodies, cookies or authorization.
log_format safe '$remote_addr $request_method $uri $status';
server {
 listen 8080;
 server_name studio.didde-mie.com;
 access_log /dev/stdout safe;
 client_max_body_size 8k;
 client_body_timeout 10s;
 add_header Referrer-Policy no-referrer always;
 add_header Cache-Control no-store always;
 location ^~ /internal/ { return 404; }
 location ~ ^/api/(contact|marketing)(/action)?$ {
  proxy_pass http://booking-communications:3012;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For "";
  proxy_set_header Host $host;
 }
 location / {
  proxy_pass http://booking:3000;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-Proto https;
  proxy_set_header X-Real-IP $remote_addr;
 }
}
server {
 listen 8080;
 server_name ttd-checkout.didde-mie.com;
 access_log /dev/stdout safe;
 client_max_body_size 2m;
 add_header Referrer-Policy no-referrer always;
 location / {
  proxy_pass http://pretix:80;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-Proto https;
  proxy_set_header X-Forwarded-For $remote_addr;
 }
}
# A separately enabled primary profile can add the chosen communications vhost.
