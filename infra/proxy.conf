# Loopback HTTP ingress; terminate TLS at the host ingress before deployment.
# Never log query strings, fragments, request bodies, cookies or authorization.
log_format safe '$remote_addr $host $request_method $status';
set_real_ip_from 127.0.0.1;
set_real_ip_from ::1;
# Docker's loopback-published port arrives from its ingress bridge gateway.
set_real_ip_from 172.16.0.0/12;
real_ip_header CF-Connecting-IP;
real_ip_recursive off;
limit_req_zone $binary_remote_addr zone=stripe_callback:10m rate=10r/s;
# Pretix order/download URLs can contain secrets in the path as well as query.
# nginx error records can contain full request URLs. Use sanitized access status
# and private service health/queue checks for diagnostics instead.
error_log /dev/null emerg;
server {
 listen 8080 default_server;
 server_name _;
 access_log /dev/stdout safe;
 return 404;
}
server {
 listen 8080;
 server_name booking.didde-mie.com;
 access_log /dev/stdout safe;
 client_max_body_size 8k;
 client_body_timeout 10s;
 add_header Referrer-Policy no-referrer always;
 add_header Cache-Control no-store always;
 location ^~ /internal/ { return 404; }
 location ^~ /api/internal/ { return 404; }
 location = /api/manage/pretix-webhook { return 404; }
 location ~ ^/api/(contact|marketing)(/action)?$ {
  proxy_pass http://booking-communications:3012;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_set_header Host $host;
 }
 location / {
  proxy_pass http://booking:3000;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-Proto https;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $remote_addr;
 }
}
server {
 listen 8080;
 server_name checkout.didde-mie.com;
 access_log /dev/stdout safe;
 client_max_body_size 2m;
 add_header Referrer-Policy same-origin always;
 location = /_stripe/webhook/ {
  limit_except POST { deny all; }
  limit_req zone=stripe_callback burst=20 nodelay;
  client_max_body_size 256k;
  client_body_timeout 10s;
  proxy_read_timeout 15s;
  proxy_pass http://booking:3000/api/internal/stripe-webhook;
  proxy_set_header Host checkout.didde-mie.com;
  proxy_set_header X-Forwarded-Proto https;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $remote_addr;
 }
 location ^~ /_stripe/ { return 404; }
 # The studio series is sold only through the booking form's validated,
 # atomic order path. Native multi-date carts can satisfy Pretix's discount
 # count with non-consecutive hours, so deny their shop and checkout routes.
 # Existing order/payment pages stay available for the validated handoff.
 location ~ ^/dd-studio/studio/(?!order/) { return 404; }
 location / {
  proxy_pass http://pretix:80;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-Proto https;
  proxy_set_header X-Forwarded-For $remote_addr;
 }
}
# Pretix cannot attach a custom Authorization header to a webhook. This
# unpublished internal listener adds the existing dedicated Basic credential
# without storing it in Pretix's target URL or webhook-call diagnostics.
server {
 listen 8081;
 server_name _;
 access_log /dev/stdout safe;
 client_max_body_size 8k;
 location = /api/manage/pretix-webhook {
  limit_except POST { deny all; }
  include /run/secrets/pretix-webhook-header;
  proxy_pass http://booking:3000;
  proxy_set_header Host booking.didde-mie.com;
  proxy_set_header X-Forwarded-Proto https;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For "";
 }
 location / { return 404; }
}
# A separately enabled primary profile can add the chosen communications vhost.
