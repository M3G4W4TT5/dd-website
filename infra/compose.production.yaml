name: dd-hosted
x-logging: &logging
  driver: local
  options: {max-size: "10m", max-file: "3"}
x-node: &node
  restart: unless-stopped
  init: true
  read_only: true
  tmpfs: ["/tmp:rw,nosuid,noexec,size=64m,mode=1777"]
  mem_limit: 256m
  cpus: 0.5
  pids_limit: 128
  logging: *logging
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  stop_grace_period: 30s

services:
  postgres:
    image: postgres:17.6-alpine
    restart: unless-stopped
    mem_limit: 512m
    cpus: 0.75
    pids_limit: 128
    logging:
      driver: local
      options: {max-size: "10m", max-file: "3"}
    command: [postgres, -c, max_connections=60, -c, shared_buffers=64MB, -c, work_mem=2MB, -c, maintenance_work_mem=64MB]
    environment:
      POSTGRES_USER: dd_admin
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/admin-password
    volumes: [postgres:/var/lib/postgresql/data]
    secrets: [admin-password]
    networks: [database]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U dd_admin -d postgres]
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7.4.5-alpine
    restart: unless-stopped
    mem_limit: 128m
    cpus: 0.25
    pids_limit: 64
    logging:
      driver: local
      options: {max-size: "10m", max-file: "3"}
    command: [redis-server, --appendonly, "yes", --maxmemory, 64mb, --maxmemory-policy, noeviction]
    volumes: [redis:/data]
    networks: [pretix]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 10s
      timeout: 3s
      retries: 5
  mail-capture:
    image: axllent/mailpit:v1.31.1
    user: "10005:10005"
    restart: unless-stopped
    read_only: true
    tmpfs: ["/tmp:rw,nosuid,noexec,size=64m,mode=1777"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    cpus: 0.25
    pids_limit: 64
    logging:
      driver: local
      options: {max-size: "10m", max-file: "3"}
    environment:
      MP_DATABASE: /tmp/mailpit.db
      MP_MAX_MESSAGES: "100"
      MP_MAX_AGE: 24h
      MP_MAX_MESSAGE_SIZE: "1"
      MP_DISABLE_VERSION_CHECK: "true"
      MP_QUIET: "true"
    ports: ["127.0.0.1:8025:8025"]
    networks: [pretix, capture-ui]
  pretix:
    image: pretix/standalone:2026.7.0
    restart: unless-stopped
    command: all
    mem_limit: 1024m
    cpus: 1.0
    pids_limit: 192
    logging: *logging
    environment:
      AUTOMIGRATE: skip
      PRETIX_CONFIG_FILE: /run/secrets/runtime
      NUM_WORKERS: "1"
    volumes:
      - pretix:/data
      - ./pretix-nginx.conf:/etc/nginx/nginx.conf:ro
      - ./pretix-settings.py:/pretix/src/production_settings.py:ro
      - ./pretix-task.conf:/etc/supervisord/pretixtask.conf:ro
    secrets:
      - source: pretix-runtime
        target: runtime
    networks: [pretix, database, ingress]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      mail-capture: {condition: service_healthy}
  pretix-cron:
    image: pretix/standalone:2026.7.0
    restart: unless-stopped
    mem_limit: 384m
    cpus: 0.5
    pids_limit: 64
    logging: *logging
    entrypoint: [/bin/sh, -c]
    command: ["while true; do pretix cron; sleep 1800; done"]
    environment:
      AUTOMIGRATE: skip
      PRETIX_CONFIG_FILE: /run/secrets/runtime
    secrets:
      - source: pretix-runtime
        target: runtime
    volumes:
      - pretix:/data
      - ./pretix-settings.py:/pretix/src/production_settings.py:ro
    networks: [pretix, database, ingress]
  pretix-migrate:
    image: pretix/standalone:2026.7.0
    profiles: [migration]
    command: migrate
    mem_limit: 768m
    cpus: 1.0
    pids_limit: 128
    logging:
      driver: local
      options: {max-size: "10m", max-file: "3"}
    environment:
      AUTOMIGRATE: skip
      PRETIX_CONFIG_FILE: /run/secrets/runtime
    secrets:
      - source: pretix-migration
        target: runtime
    volumes: [pretix:/data]
    networks: [database, pretix]
  booking:
    <<: *node
    mem_limit: 512m
    cpus: 0.75
    build: {context: .., dockerfile: infra/Dockerfile, target: booking}
    user: "10001:10001"
    networks: [database, booking-internal, ingress]
    secrets:
      - source: booking-web
        target: runtime
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 4s
      retries: 6
  booking-communications:
    <<: *node
    tmpfs:
      - /tmp:rw,nosuid,noexec,size=64m,mode=1777
      - /capture:rw,nosuid,noexec,size=32m,mode=0700,uid=10002,gid=10002
    build: {context: .., dockerfile: infra/Dockerfile, target: communications}
    user: "10002:10002"
    networks: [database, booking-internal, ingress]
    secrets:
      - source: booking-communications
        target: runtime
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3012/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 4s
      retries: 6
  booking-worker:
    <<: *node
    tmpfs:
      - /tmp:rw,nosuid,noexec,size=64m,mode=1777
      - /capture:rw,nosuid,noexec,size=32m,mode=0700,uid=10003,gid=10003
    build: {context: .., dockerfile: infra/Dockerfile, target: worker}
    user: "10003:10003"
    networks: [database, ingress]
    secrets:
      - source: booking-worker
        target: runtime
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3013/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 4s
      retries: 6
  proxy:
    image: nginxinc/nginx-unprivileged:1.29-alpine
    # Compose bind-mounts local secrets with their host ownership and mode.
    # The dedicated group reads only the internal webhook header, not other secrets.
    group_add: ["10006"]
    restart: unless-stopped
    mem_limit: 64m
    cpus: 0.25
    pids_limit: 64
    logging: *logging
    ports: ["127.0.0.1:8080:8080"]
    volumes: ["./proxy.conf:/etc/nginx/conf.d/default.conf:ro"]
    secrets:
      - source: pretix-webhook-header
        target: pretix-webhook-header
    networks:
      ingress: {}
      booking-internal:
        aliases: [booking-public-proxy]
    depends_on: [booking, booking-communications, pretix]
  primary-communications:
    <<: *node
    profiles: [primary]
    build: {context: .., dockerfile: infra/Dockerfile, target: communications}
    command: [node, --env-file=/run/secrets/runtime, --import, tsx, server/runtime/main.ts, primary]
    user: "10004:10004"
    networks: [database, ingress]
    secrets:
      - source: primary-communications
        target: runtime
  primary:
    profiles: [primary]
    build:
      context: ..
      dockerfile: infra/Dockerfile
      target: primary
      args:
        PUBLIC_SERVICES_URL: ${PUBLIC_SERVICES_URL:-}
        PUBLIC_BOOKING_URL: ${PUBLIC_BOOKING_URL:-https://booking.didde-mie.com}
    networks: [ingress]

networks:
  database: {internal: true}
  pretix: {internal: true}
  booking-internal: {internal: true}
  ingress: {}
  capture-ui: {}
volumes:
  postgres: {}
  redis: {}
  pretix: {}
secrets:
  admin-password: {file: "${DD_SECRET_DIRECTORY:?Set private deployment secret directory}/postgres-admin-password"}
  pretix-runtime: {file: "${DD_SECRET_DIRECTORY}/pretix-runtime.cfg"}
  pretix-migration: {file: "${DD_SECRET_DIRECTORY}/pretix-migration.cfg"}
  booking-web: {file: "${DD_SECRET_DIRECTORY}/booking-web.env"}
  booking-worker: {file: "${DD_SECRET_DIRECTORY}/booking-worker.env"}
  booking-communications: {file: "${DD_SECRET_DIRECTORY}/booking-communications.env"}
  pretix-webhook-header: {file: "${DD_SECRET_DIRECTORY}/pretix-webhook-header.conf"}
  primary-communications: {file: "${DD_SECRET_DIRECTORY}/primary-communications.env"}
