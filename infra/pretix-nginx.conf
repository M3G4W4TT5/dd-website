user www-data www-data;
worker_processes 1;
pid /var/run/nginx.pid;
daemon off;
events { worker_connections 1024; }
http {
 server_tokens off;
 include /etc/nginx/mime.types;
 default_type application/octet-stream;
 sendfile on;
 charset utf-8;
 log_format private '$request_method $status';
 access_log /dev/stdout private;
 error_log /dev/null emerg;
 add_header X-Content-Type-Options nosniff;
 add_header Referrer-Policy no-referrer;
 server {
  listen 80 default_server;
  server_name _;
  location /media/ { alias /data/media/; expires 7d; access_log off; }
  location ^~ /media/cachedfiles { return 404; }
  location ^~ /media/invoices { return 404; }
  location = /static/staticfiles.json { return 404; }
  location = /static/CACHE/manifest.json { return 404; }
  location /static/ {
   alias /pretix/src/pretix/static.dist/;
   access_log off;
   expires 365d;
  }
  location / {
   # Preserve the image's unnormalized path forwarding for encoded filenames.
   proxy_pass http://unix:/tmp/pretix.sock:;
   proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
   proxy_set_header Host $http_host;
   proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
  }
 }
}
