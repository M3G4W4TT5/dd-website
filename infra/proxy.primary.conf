# Loaded only by compose.primary.yaml. No apex frontend vhost.
server {
 listen 8080;
 server_name forms.didde-mie.com;
 access_log /dev/stdout safe;
 client_max_body_size 8k;
 client_body_timeout 10s;
 add_header Referrer-Policy no-referrer always;
 add_header Cache-Control no-store always;
 location = /api/contact { include /etc/nginx/conf.d/primary-routes.inc; }
 location = /api/marketing { include /etc/nginx/conf.d/primary-routes.inc; }
 location = /api/marketing/action { include /etc/nginx/conf.d/primary-routes.inc; }
 location / { return 404; }
}
