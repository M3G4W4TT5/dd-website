name: Personal Pages checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  personal:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.20.0
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run typecheck -w @dd/personal
      - run: npm run typecheck:studio
      - run: npm run test:personal-cms
      - run: npm run build:studio
      - run: npm run build:personal-preview
      - run: npm run test:pages
      - run: npm run typecheck:pages
      - run: npm run build:personal
        env:
          DD_MODE: production
          PUBLIC_BOOKING_URL: https://booking.didde-mie.com
          PUBLIC_SERVICES_URL: https://didde-mie.com
      - run: npm run build:pages-functions
      - run: python3 infra/primary-release.test.py
